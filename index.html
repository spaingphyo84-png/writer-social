<html lang="en">

    <meta name="description" content="Writer's Realm — စာရေးဆရာများ၏ ကလောင်ကမ္ဘာ. A literary social home for poets and storytellers." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      (function () {
        try {
          if (localStorage.getItem('writers-realm-theme') === 'dark') document.documentElement.classList.add('dark')
          if (localStorage.getItem('writers-realm-locale') === 'my') document.documentElement.lang = 'my'
        } catch (error) {}
      })()
    </script>

    <div id="root"></div>
